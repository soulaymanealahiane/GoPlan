<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Sign in · GoPlan</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="design.css"><link rel="stylesheet" href="accounts.css"><link rel="stylesheet" href="brand.css"><link rel="icon" href="/goplan-mark.svg"><script type="module" src="signin.js"></script></head><body><main class="account-welcome"><a class="brand" href="/"><img class="brand-shared" src="/goplan-mark.svg" alt="" width="35" height="35">GoPlan</a><h1 id="auth-title">Welcome back.</h1><p id="auth-intro">Sign in to your personal roadmap. Your GoPlan account is separate from your university account.</p>

<form id="login-form"><label class="field">Email<input id="login-email" type="email" autocomplete="username" required maxlength="254"></label><label class="field">Password<input id="login-password" type="password" autocomplete="current-password" required maxlength="128"></label><button class="button primary" type="submit">Sign in</button><button class="text-button" id="reset-password" type="button">Forgot password or haven't set one?</button><button class="text-button" id="create-account" type="button">Create an account</button></form>

<form id="email-form" hidden><label class="field">Email<input id="email" type="email" autocomplete="email" required maxlength="254"></label><button class="button primary" type="submit">Send verification code</button><button class="text-button" id="back-login" type="button">Back to sign in</button></form>

<form id="code-form" hidden><label class="field">Code from your email<input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,8}" minlength="6" maxlength="8" required></label><button class="button primary" type="submit">Verify email</button><button class="text-button" id="different-email" type="button">Send another code</button></form>

<form id="password-form" hidden><label class="field">Create password<input id="new-password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required aria-describedby="password-help"></label><p class="small-note" id="password-help">At least 12 characters. A few memorable words work well.</p><label class="field">Confirm password<input id="confirm-password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><button class="button primary" type="submit">Save password &amp; continue</button><button class="text-button" id="restart-verification" type="button">Verify again</button></form>

<p id="auth-status" role="status" aria-live="polite"></p><p class="small-note"><a href="privacy.html">Privacy</a></p></main></body></html>
